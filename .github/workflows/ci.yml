name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require production entrypoint
        run: test -f index.html

      - name: Reject files larger than 500 KB
        shell: bash
        run: |
          oversized="$(find . -type f -not -path './.git/*' -size +500k -print -quit)"
          if [ -n "$oversized" ]; then
            echo "::error::File exceeds 500 KB: $oversized"
            exit 1
          fi

      - name: Block unfinished or sensitive text in site files
        shell: bash
        run: |
          if grep -RniE '\b(TODO|FIXME|senha|password)\b' index.html style.css assets/; then
            echo "::error::Remove TODO/FIXME markers and sensitive terms from site files."
            exit 1
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              exit "$result"
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Lint HTML
        run: npm run lint

      - name: Validate links and images
        run: npm run validate:site
