name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -R assets _site/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    if: always() && needs.deploy.result == 'failure'
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Email deploy failure
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_USERNAME" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$NOTIFY_EMAIL_FROM" ] || [ -z "$NOTIFY_EMAIL_TO" ]; then
            echo "::warning::Email not sent. Configure the SMTP and NOTIFY_EMAIL_* repository secrets."
            exit 0
          fi
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          message = EmailMessage()
          message["Subject"] = f"GitHub Pages deploy failed: {os.environ['REPOSITORY']}"
          message["From"] = os.environ["NOTIFY_EMAIL_FROM"]
          message["To"] = os.environ["NOTIFY_EMAIL_TO"]
          message.set_content(
              "The GitHub Pages deployment failed.\n"
              f"Repository: {os.environ['REPOSITORY']}\n"
              f"Run details: {os.environ['RUN_URL']}\n"
          )

          with smtplib.SMTP(os.environ["SMTP_HOST"], int(os.environ["SMTP_PORT"]), timeout=20) as server:
              server.starttls(context=ssl.create_default_context())
              server.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
              server.send_message(message)
          PY
